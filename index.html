/* ============================================================
   GLSL — Simplex 3D 噪声
   ============================================================ */
const NOISE_GLSL = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

/* ============================================================
   1. 程序化太空音频
   ============================================================ */
class SpaceAudio {
    constructor(){ this.ctx=null; this.master=null; this.pad=[]; this.ambientStarted=false; }
    init(){
        if(this.ctx) return;
        this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
        this.reverb = this.ctx.createConvolver();
        this.reverb.buffer = this.makeImpulse(3.5, 2.0);
        const rg = this.ctx.createGain(); rg.gain.value = 0.35;
        this.master.connect(this.reverb); this.reverb.connect(rg); rg.connect(this.ctx.destination);
        this.master.connect(this.ctx.destination);
        this.startAmbient();
    }
    makeImpulse(dur, decay){
        const sr=this.ctx.sampleRate, len=sr*dur, buf=this.ctx.createBuffer(2,len,sr);
        for(let c=0;c<2;c++){ const d=buf.getChannelData(c);
            for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
        return buf;
    }
    startAmbient(){
        if(this.ambientStarted) return; this.ambientStarted=true;
        const notes=[73.42,110.0,146.83,220.0,293.66]; // D2,A2,D3,A3,D4
        notes.forEach((f,i)=>{
            const o=this.ctx.createOscillator();
            o.type = i<2?'sine':(i<4?'triangle':'sine'); o.frequency.value=f;
            o.detune.value=(Math.random()-0.5)*8;
            const flt=this.ctx.createBiquadFilter(); flt.type='lowpass';
            flt.frequency.value=600+i*120; flt.Q.value=1.5;
            const g=this.ctx.createGain(); g.gain.value=0;
            o.connect(flt); flt.connect(g); g.connect(this.master); o.start();
            const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.05+i*0.025;
            const lg=this.ctx.createGain(); lg.gain.value=0.03-i*0.004;
            lfo.connect(lg); lg.connect(g.gain); lfo.start();
            g.gain.linearRampToValueAtTime(0.09-i*0.012, this.ctx.currentTime+6);
            this.pad.push({o,g,lfo});
        });
        // 太空风声
        const nb=this.ctx.createBuffer(1,this.ctx.sampleRate*4,this.ctx.sampleRate);
        const nd=nb.getChannelData(0);
        for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*0.5;
        const n=this.ctx.createBufferSource(); n.buffer=nb; n.loop=true;
        const nf=this.ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=200; nf.Q.value=0.7;
        const ng=this.ctx.createGain(); ng.gain.value=0.04;
        const nl=this.ctx.createOscillator(); nl.frequency.value=0.08;
        const nlg=this.ctx.createGain(); nlg.gain.value=0.02;
        nl.connect(nlg); nlg.connect(ng.gain); nl.start();
        n.connect(nf); nf.connect(ng); ng.connect(this.master); n.start();
    }
    tone(freq, dur, type='triangle', vol=0.18, slideTo=null){
        if(!this.ctx) return;
        const t=this.ctx.currentTime, o=this.ctx.createOscillator();
        o.type=type; o.frequency.setValueAtTime(freq,t);
        if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
        const g=this.ctx.createGain();
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t+dur);
        const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq*4;
        o.connect(f); f.connect(g); g.connect(this.master);
        o.start(t); o.stop(t+dur+0.05);
    }
    fist(){ this.tone(220,1.2,'sine',0.2,80); }
    open(){ this.tone(330,1.0,'triangle',0.18,660); }
    five(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>this.tone(f,1.2,'triangle',0.14),i*50)); }
    heart(){ [392,523.25,659.25].forEach((f,i)=>setTimeout(()=>this.tone(f,1.8,'sine',0.16),i*120)); }
    bothOpen(){ [293.66,369.99,440.0,587.33].forEach((f,i)=>setTimeout(()=>this.tone(f,1.8,'triangle',0.14),i*60)); }
    bothFist(){ this.tone(440,0.4,'sawtooth',0.22,55); setTimeout(()=>this.tone(110,0.8,'sine',0.2,40),200); }
    pinch(){ this.tone(880,0.3,'sine',0.15,1320); setTimeout(()=>this.tone(1760,0.2,'sine',0.1),40); }
    fireworkBoom(){ this.tone(80,0.6,'sawtooth',0.15,40); }
}

/* ============================================================
   2. Three.js 场景
   ============================================================ */
function initThree(){
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000005, 0.0004);
    clock = new THREE.Clock();
    camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
    camera.position.set(0,0,CONFIG.camera.defaultDistance);
    renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
    // 借鉴站点2:像素比上限 1.5 保性能
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000005, 1);
    container.appendChild(renderer.domElement);

    const rp = new RenderPass(scene, camera);
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.4,0.6,0.2);
    bloom.strength=1.6; bloom.radius=0.6; bloom.threshold=0.0;
    composer = new EffectComposer(renderer);
    composer.addPass(rp); composer.addPass(bloom);

    buildPlanet(); buildRings(); buildStars(); buildNebula();
    buildGlow(); buildEmbers();
    buildMeteors(); buildFireworks(); buildTextSystem();
    addEventListener('resize', onResize);
}

/* ---------- 粒子星球(噪声呼吸 + 心形变形) ---------- */
let planetOriginalPos, planetHeartPos;
function buildPlanet(){
    const { count, radius, shell, noiseStrength, noiseScale, noiseSpeed, particleSize, diffRot, flare } = CONFIG.planet;
    const positions = new Float32Array(count*3);
    const colors = new Float32Array(count*3);
    const scales = new Float32Array(count);
    const phases = new Float32Array(count);
    const tmp = new THREE.Color();
    planetOriginalPos = new Float32Array(count*3);
    planetHeartPos = new Float32Array(count*3);

    for(let i=0;i<count;i++){
        const u=Math.random(), v=Math.random();
        const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
        const r = radius*(1.0-Math.random()*shell);
        const x=r*Math.sin(phi)*Math.cos(theta), y=r*Math.sin(phi)*Math.sin(theta), z=r*Math.cos(phi);
        positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
        planetOriginalPos[i*3]=x; planetOriginalPos[i*3+1]=y; planetOriginalPos[i*3+2]=z;

        // 心形目标位置(参数方程,借鉴站点1)
        const t = Math.random()*Math.PI*2;
        const hr = Math.sqrt(Math.random()) * radius * 0.012;
        const hx = 16*Math.sin(t)**3 * hr;
        const hy = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) * hr;
        const hz = (Math.random()-0.5) * hr * 4;
        planetHeartPos[i*3]=hx; planetHeartPos[i*3+1]=hy; planetHeartPos[i*3+2]=hz;

        const depth = 1-(r/radius);
        // 8% 蓝白高温粒子(年轻恒星点缀),其余橙金主体
        if(Math.random() < 0.08){
            tmp.setHSL(0.56+(Math.random()-0.5)*0.05, 0.7, 0.68+depth*0.15);
        } else {
            const hue = 0.12 - depth*0.06;
            tmp.setHSL(hue, 0.9, 0.45+depth*0.35);
        }
        tmp.offsetHSL((Math.random()-0.5)*0.02, 0, (Math.random()-0.5)*0.1);
        colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
        scales[i] = 0.5+Math.random()*1.2;
        phases[i] = Math.random();
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(colors,3));
    geo.setAttribute('aScale', new THREE.BufferAttribute(scales,1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phases,1));
    // 心形目标位置作为 attribute(在 shader 中与原位置 lerp)
    geo.setAttribute('aHeartPos', new THREE.BufferAttribute(planetHeartPos,3));

    planetMat = new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        uniforms:{
            uTime:{value:0}, uNoiseStrength:{value:noiseStrength}, uNoiseScale:{value:noiseScale},
            uNoiseSpeed:{value:noiseSpeed}, uSize:{value:particleSize}, uPixelRatio:{value:renderer.getPixelRatio()},
            uPulse:{value:0}, uGlow:{value:1.0}, uMorph:{value:0},  // uMorph: 0=球 1=心
            uDiffRot:{value:diffRot}, uFlare:{value:flare},
        },
        vertexShader: NOISE_GLSL + `
            uniform float uTime, uNoiseStrength, uNoiseScale, uNoiseSpeed, uSize, uPixelRatio, uPulse, uMorph, uDiffRot, uFlare;
            attribute vec3 aColor; attribute float aScale; attribute vec3 aHeartPos; attribute float aPhase;
            varying vec3 vColor; varying float vDisp; varying float vRim; varying float vEnergy; varying float vFlare;
            void main(){
                vec3 nrm = normalize(position);
                // 差速自转:赤道快、两极慢(类气态巨行星的流动感)
                float lat2 = 1.0 - nrm.y*nrm.y;
                float ang = uTime * uDiffRot * (0.35 + 0.65*lat2);
                float ca = cos(ang), sa = sin(ang);
                vec3 p = vec3(position.x*ca - position.z*sa, position.y, position.x*sa + position.z*ca);

                // 三八度噪声:慢起伏 + 中尺度涌动 + 细涟漪
                float n1 = snoise(p*uNoiseScale + vec3(0.0, uTime*uNoiseSpeed, 0.0));
                float n2 = snoise(p*uNoiseScale*2.7 - vec3(uTime*uNoiseSpeed*1.3, 0.0, 0.0)) * 0.5;
                float n3 = snoise(p*uNoiseScale*5.5 + vec3(0.0, 0.0, uTime*uNoiseSpeed*2.2)) * 0.22;
                float disp = (n1 + n2 + n3) * uNoiseStrength * (1.0 + uPulse*2.0);

                // 等离子耀斑:噪声峰值处周期性向外喷发
                float flareGate = smoothstep(0.5, 0.95, n1);
                float flarePulse = 0.55 + 0.45*sin(uTime*2.6 + aPhase*6.2831);
                float flare = flareGate * flarePulse * uFlare;
                disp += flare;

                // 能量亮带:沿球面传播的热波
                float wave = sin(dot(nrm, vec3(0.6,0.75,0.3))*5.0 - uTime*1.4);
                vEnergy = smoothstep(0.82, 0.99, wave);

                // 球形 ↔ 心形 lerp
                vec3 basePos = mix(p, aHeartPos, uMorph);
                vec3 pos = basePos + nrm * disp * (1.0 - uMorph*0.6);
                vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mv;

                // 临边增亮:视角边缘的粒子更亮(恒星辉光感)
                vec3 vNrm = normalize(normalMatrix * nrm);
                vec3 viewDir = normalize(-mv.xyz);
                vRim = pow(1.0 - abs(dot(vNrm, viewDir)), 2.0);

                // 逐粒子闪烁(各自独立相位)
                float tw = 0.78 + 0.22*sin(uTime*2.8 + aPhase*6.2831);
                gl_PointSize = uSize * aScale * tw * uPixelRatio * (300.0/max(0.001,-mv.z));

                vColor = aColor; vDisp = disp;
                vFlare = flareGate * flarePulse;
            }`,
        fragmentShader: `
            varying vec3 vColor; varying float vDisp; varying float vRim; varying float vEnergy; varying float vFlare;
            uniform float uGlow, uPulse, uMorph;
            void main(){
                vec2 uv = gl_PointCoord - 0.5;
                float r = length(uv);
                if(r>0.5) discard;
                float falloff = exp(-6.5*r*r*4.0);
                vec3 col = vColor * (0.72 + abs(vDisp)*0.16);
                // 耀斑热点 → 白热
                col = mix(col, vec3(1.0,0.95,0.8), clamp(vFlare,0.0,1.0)*0.7);
                // 能量亮带 → 暖橙脉冲
                col += vec3(1.0,0.75,0.45) * vEnergy * 0.45;
                // 临边光辉 → 深橙红
                col += vec3(1.0,0.35,0.12) * vRim * 0.5;
                // 中心高光
                col = mix(col, vec3(1.0,0.85,0.6), pow(falloff,3.0)*0.35);
                // 心形模式偏粉
                col = mix(col, vec3(1.0,0.5,0.7), uMorph*0.6);
                col *= (1.0 + uPulse*1.5);
                float alpha = falloff * uGlow * (1.0 + vRim*0.5 + vEnergy*0.4);
                gl_FragColor = vec4(col, alpha);
            }`,
    });
    planet = new THREE.Points(geo, planetMat);
    scene.add(planet);
}

/* ---------- 内核辉光 + 大气光晕(填充粒子间隙的体积感) ---------- */
function makeGlowTexture(stops){
    const cv=document.createElement('canvas'); cv.width=cv.height=256;
    const ctx=cv.getContext('2d');
    const grad=ctx.createRadialGradient(128,128,0,128,128,128);
    stops.forEach(([pos,col])=>grad.addColorStop(pos,col));
    ctx.fillStyle=grad; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(cv);
}

function buildGlow(){
    // 内核辉光:白热中心,补足粒子间隙
    const coreTex=makeGlowTexture([
        [0.0,'rgba(255,242,214,1.0)'],
        [0.22,'rgba(255,185,95,0.6)'],
        [0.55,'rgba(255,115,35,0.16)'],
        [1.0,'rgba(255,80,20,0)'],
    ]);
    coreGlow=new THREE.Sprite(new THREE.SpriteMaterial({
        map:coreTex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
        opacity:CONFIG.planet.coreGlow.opacity,
    }));
    coreGlow.scale.setScalar(CONFIG.planet.coreGlow.scale);
    scene.add(coreGlow);

    // 外层大气光晕:柔和的橙色包络
    const haloTex=makeGlowTexture([
        [0.0,'rgba(255,175,85,0.5)'],
        [0.35,'rgba(255,125,45,0.2)'],
        [0.7,'rgba(255,85,28,0.06)'],
        [1.0,'rgba(255,60,20,0)'],
    ]);
    halo=new THREE.Sprite(new THREE.SpriteMaterial({
        map:haloTex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
        opacity:CONFIG.planet.halo.opacity,
    }));
    halo.scale.setScalar(CONFIG.planet.halo.scale);
    scene.add(halo);
}

/* ---------- 太阳风余烬(GPU 驱动:表面持续向外飘散的火粒) ---------- */
function buildEmbers(){
    const { count, rise, size } = CONFIG.planet.ember;
    const pos=new Float32Array(count*3), col=new Float32Array(count*3);
    const phase=new Float32Array(count), speed=new Float32Array(count), scl=new Float32Array(count);
    const c=new THREE.Color();
    for(let i=0;i<count;i++){
        const u=Math.random(), v=Math.random();
        const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
        pos[i*3]=Math.sin(phi)*Math.cos(theta);
        pos[i*3+1]=Math.sin(phi)*Math.sin(theta);
        pos[i*3+2]=Math.cos(phi);
        phase[i]=Math.random();
        speed[i]=0.22+Math.random()*0.45;
        scl[i]=0.6+Math.random()*1.3;
        c.setHSL(0.07+Math.random()*0.06, 0.95, 0.55+Math.random()*0.2);
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(col,3));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phase,1));
    geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed,1));
    geo.setAttribute('aScale', new THREE.BufferAttribute(scl,1));
    const m=new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        uniforms:{ uTime:{value:0}, uPixelRatio:{value:renderer.getPixelRatio()},
                   uSize:{value:size}, uRise:{value:rise}, uRadius:{value:CONFIG.planet.radius},
                   uMorph:{value:0} },
        vertexShader:`
            uniform float uTime, uPixelRatio, uSize, uRise, uRadius, uMorph;
            attribute vec3 aColor;
            attribute float aPhase;
            attribute float aSpeed;
            attribute float aScale;
            varying vec3 vColor; varying float vAlpha;
            void main(){
                // 生命周期:出生→上升→消亡,全 GPU 循环
                float life = fract(uTime*aSpeed + aPhase);
                vec3 nrm = normalize(position);
                float r = uRadius*1.02 + life*uRise;
                // 随差速缓漂的切向运动
                float lat2 = 1.0 - nrm.y*nrm.y;
                float ang = uTime*0.12*(0.35+0.65*lat2);
                float ca=cos(ang), sa=sin(ang);
                vec3 pos = nrm*r;
                pos = vec3(pos.x*ca - pos.z*sa, pos.y, pos.x*sa + pos.z*ca);
                vec4 mv = modelViewMatrix*vec4(pos,1.0);
                gl_Position = projectionMatrix*mv;
                float flicker = 0.7+0.3*sin(uTime*7.0 + aPhase*80.0);
                vAlpha = sin(life*3.14159) * flicker * (1.0-uMorph);
                gl_PointSize = uSize*aScale*uPixelRatio*(300.0/max(0.001,-mv.z));
                vColor = aColor;
            }`,
        fragmentShader:`
            varying vec3 vColor; varying float vAlpha;
            void main(){
                vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                if(r>0.5) discard;
                float f=exp(-6.0*r*r*4.0);
                gl_FragColor=vec4(vColor, f*vAlpha*0.85);
            }`,
    });
    emberSystem=new THREE.Points(geo,m);
    scene.add(emberSystem);
}

/* ---------- 星环 ---------- */
function buildRings(){
    CONFIG.rings.forEach(cfg=>{
        const pos=new Float32Array(cfg.count*3), scl=new Float32Array(cfg.count);
        for(let i=0;i<cfg.count;i++){
            const a=Math.random()*Math.PI*2;
            const r=THREE.MathUtils.lerp(cfg.inner,cfg.outer,Math.random());
            pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-0.5)*1.5; pos[i*3+2]=Math.sin(a)*r;
            scl[i]=0.5+Math.random()*1.0;
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
        geo.setAttribute('aScale', new THREE.BufferAttribute(scl,1));
        const m=new THREE.ShaderMaterial({
            transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
            uniforms:{ uSize:{value:14.0}, uPixelRatio:{value:renderer.getPixelRatio()}, uExpand:{value:1.0}, uBrightness:{value:1.0} },
            vertexShader:`
                uniform float uSize, uPixelRatio, uExpand; attribute float aScale;
                void main(){
                    vec3 p = position * uExpand;
                    vec4 mv = modelViewMatrix*vec4(p,1.0);
                    gl_Position = projectionMatrix*mv;
                    gl_PointSize = uSize*aScale*uPixelRatio*(300.0/max(0.001,-mv.z));
                }`,
            fragmentShader:`
                uniform float uBrightness;
                void main(){
                    vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                    if(r>0.5) discard;
                    float f = exp(-5.5*r*r*4.0);
                    gl_FragColor = vec4(vec3(1.0,0.95,0.88)*uBrightness, f*0.85);
                }`,
        });
        const pts=new THREE.Points(geo,m);
        pts.rotation.x=cfg.tiltX; pts.rotation.z=cfg.tiltZ;
        pts.userData={spin:cfg.spin};
        ringMeshes.push(pts); ringMats.push(m);
        scene.add(pts);
    });
}

/* ---------- 多层星空 ---------- */
function buildStars(){
    CONFIG.stars.forEach(cfg=>{
        const pos=new Float32Array(cfg.count*3), col=new Float32Array(cfg.count*3), scl=new Float32Array(cfg.count);
        const c=new THREE.Color();
        for(let i=0;i<cfg.count;i++){
            const u=Math.random(), v=Math.random();
            const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
            const r=cfg.radius*(0.5+Math.random()*0.5);
            pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
            pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
            pos[i*3+2]=r*Math.cos(phi);
            const t=Math.random();
            if(t<0.6) c.setRGB(1,1,1); else if(t<0.8) c.setRGB(0.7,0.85,1.0); else c.setRGB(1.0,0.95,0.8);
            col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
            scl[i]=0.3+Math.random()*0.9;
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
        geo.setAttribute('aColor', new THREE.BufferAttribute(col,3));
        geo.setAttribute('aScale', new THREE.BufferAttribute(scl,1));
        const m=new THREE.ShaderMaterial({
            transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
            uniforms:{ uTime:{value:0}, uSize:{value:cfg.size*6}, uPixelRatio:{value:renderer.getPixelRatio()} },
            vertexShader:`
                uniform float uTime, uSize, uPixelRatio; attribute vec3 aColor; attribute float aScale;
                varying vec3 vColor; varying float vTwinkle;
                void main(){
                    vec4 mv=modelViewMatrix*vec4(position,1.0);
                    gl_Position=projectionMatrix*mv;
                    gl_PointSize=uSize*aScale*uPixelRatio;
                    vColor=aColor;
                    vTwinkle=0.6+0.4*sin(uTime*2.0+position.x*0.1+position.y*0.13);
                }`,
            fragmentShader:`
                varying vec3 vColor; varying float vTwinkle;
                void main(){
                    vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                    if(r>0.5) discard;
                    float f=exp(-5.0*r*r*4.0);
                    gl_FragColor=vec4(vColor*vTwinkle, f);
                }`,
        });
        const pts=new THREE.Points(geo,m);
        pts.userData={spin:cfg.spin};
        starLayers.push({pts,mat:m,cfg});
        scene.add(pts);
    });
}

/* ---------- 星云 ---------- */

            void main(){
                vec2 uv=gl_PointCoord-0.5; float r=length(uv);

                float f=exp(-3.0*r*r*4.0)*0.15;

}

/* ---------- 流星雨(velocity-as-attribute,借鉴站点1) ---------- */
function buildMeteors(){
    const {count, range, speedMin, speedMax, length} = CONFIG.meteor;
    const pos=new Float32Array(count*3), vel=new Float32Array(count*3), len=new Float32Array(count);
    for(let i=0;i<count;i++){
        pos[i*3]=(Math.random()-0.5)*range*2;
        pos[i*3+1]=Math.random()*range;
        pos[i*3+2]=(Math.random()-0.5)*range*2;
        const sp=speedMin+Math.random()*(speedMax-speedMin);
        vel[i*3]=(Math.random()-0.5)*2; vel[i*3+1]=-sp; vel[i*3+2]=(Math.random()-0.5)*2;
        len[i]=length*(0.5+Math.random()*0.5);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aVel', new THREE.BufferAttribute(vel,3));
    geo.setAttribute('aLen', new THREE.BufferAttribute(len,1));
    const m=new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        uniforms:{ uPixelRatio:{value:renderer.getPixelRatio()}, uTime:{value:0} },
        vertexShader:`
            uniform float uPixelRatio; attribute vec3 aVel; attribute float aLen;
            varying float vSpeed;
            void main(){
                vec4 mv=modelViewMatrix*vec4(position,1.0);
                gl_Position=projectionMatrix*mv;
                gl_PointSize=aLen*uPixelRatio*(200.0/max(0.001,-mv.z));
                vSpeed=length(aVel);
            }`,
        fragmentShader:`
            varying float vSpeed;
            void main(){
                vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                if(r>0.5) discard;
                float f=exp(-4.0*r*r*4.0);
                vec3 col=mix(vec3(0.5,0.8,1.0), vec3(1.0,1.0,1.0), vSpeed/15.0);
                gl_FragColor=vec4(col, f*0.8);
            }`,
    });
    meteorSystem=new THREE.Points(geo,m);
    scene.add(meteorSystem);
}

function updateMeteors(dt){
    const pos=meteorSystem.geometry.attributes.position.array;
    const vel=meteorSystem.geometry.attributes.aVel.array;
    const {count, range}=CONFIG.meteor;
    for(let i=0;i<count;i++){
        pos[i*3]+=vel[i*3]*dt*10;
        pos[i*3+1]+=vel[i*3+1]*dt*10;
        pos[i*3+2]+=vel[i*3+2]*dt*10;
        // 回收
        if(pos[i*3+1] < -range*0.5){
            pos[i*3]=(Math.random()-0.5)*range*2;
            pos[i*3+1]=range*0.5+Math.random()*200;
            pos[i*3+2]=(Math.random()-0.5)*range*2;
        }
    }
    meteorSystem.geometry.attributes.position.needsUpdate=true;
}

/* ---------- 烟花粒子池(预分配 + 状态机,借鉴站点1) ---------- */
let fwPos, fwVel, fwCol, fwLife, fwMaxLife, fwSize, fwAliveCount=0;
function buildFireworks(){
    const N=CONFIG.firework.poolSize;
    fwPos=new Float32Array(N*3); fwVel=new Float32Array(N*3);
    fwCol=new Float32Array(N*3); fwLife=new Float32Array(N); fwMaxLife=new Float32Array(N);
    fwSize=new Float32Array(N);
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(fwPos,3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(fwCol,3));
    geo.setAttribute('aLife', new THREE.BufferAttribute(fwLife,1));
    geo.setAttribute('aSize', new THREE.BufferAttribute(fwSize,1));
    const m=new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        uniforms:{ uPixelRatio:{value:renderer.getPixelRatio()} },
        vertexShader:`
            uniform float uPixelRatio; attribute vec3 aColor; attribute float aLife; attribute float aSize;
            varying vec3 vColor; varying float vLife;
            void main(){
                if(aLife<=0.0){ gl_Position=vec4(2.0,2.0,2.0,1.0); gl_PointSize=0.0; vLife=0.0; return; }
                vec4 mv=modelViewMatrix*vec4(position,1.0);
                gl_Position=projectionMatrix*mv;
                gl_PointSize=aSize*uPixelRatio*(300.0/max(0.001,-mv.z));
                vColor=aColor; vLife=aLife;
            }`,
        fragmentShader:`
            varying vec3 vColor; varying float vLife;
            void main(){
                if(vLife<=0.0) discard;
                vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                if(r>0.5) discard;
                float f=exp(-6.0*r*r*4.0);
                gl_FragColor=vec4(vColor*vLife, f*vLife);
            }`,
    });
    fireworkSystem=new THREE.Points(geo,m);
    scene.add(fireworkSystem);
}

function createExplosion(x,y,z, count, colorList){
    const N=CONFIG.firework.poolSize;
    for(let n=0;n<count;n++){
        let idx=-1;
        for(let i=0;i<N;i++){ if(fwLife[i]<=0){ idx=i; break; } }
        if(idx<0) break;
        const u=Math.random(), v=Math.random();
        const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
        const sp=2+Math.random()*8;
        fwPos[idx*3]=x; fwPos[idx*3+1]=y; fwPos[idx*3+2]=z;
        fwVel[idx*3]=Math.sin(phi)*Math.cos(theta)*sp;
        fwVel[idx*3+1]=Math.sin(phi)*Math.sin(theta)*sp;
        fwVel[idx*3+2]=Math.cos(phi)*sp;
        const c=colorList[Math.floor(Math.random()*colorList.length)];
        fwCol[idx*3]=c.r; fwCol[idx*3+1]=c.g; fwCol[idx*3+2]=c.b;
        fwLife[idx]=1.0; fwMaxLife[idx]=1.0; fwSize[idx]=3+Math.random()*4;
    }
    fireworkSystem.geometry.attributes.position.needsUpdate=true;
    fireworkSystem.geometry.attributes.aColor.needsUpdate=true;
    fireworkSystem.geometry.attributes.aLife.needsUpdate=true;
    fireworkSystem.geometry.attributes.aSize.needsUpdate=true;
    audio.fireworkBoom();
}

function updateFireworks(dt){
    const {gravity, drag, lifeDecay}=CONFIG.firework;
    const N=CONFIG.firework.poolSize;
    for(let i=0;i<N;i++){
        if(fwLife[i]<=0) continue;
        fwPos[i*3]+=fwVel[i*3]*dt*30;
        fwPos[i*3+1]+=fwVel[i*3+1]*dt*30;
        fwPos[i*3+2]+=fwVel[i*3+2]*dt*30;
        fwVel[i*3+1]-=gravity;  // 重力
        fwVel[i*3]*=drag; fwVel[i*3+1]*=drag; fwVel[i*3+2]*=drag;
        fwLife[i]-=lifeDecay;
        if(fwLife[i]<0) fwLife[i]=0;
    }
    fireworkSystem.geometry.attributes.position.needsUpdate=true;
    fireworkSystem.geometry.attributes.aLife.needsUpdate=true;
}

/* ---------- 文字粒子系统(canvas像素采样,借鉴站点1) ---------- */
let textParticles=null, textMat=null, textTargetIdx=0, textMorphFactor=0;
const textColors = { '新年快乐':[1,0.8,0.3], '万事如意':[1,0.6,0.4], '平安吉祥':[0.4,1,0.7] };
let currentText='';

function generateTextPositions(text, targetCount){
    const cv=document.createElement('canvas');
    cv.width=CONFIG.text.canvasW; cv.height=CONFIG.text.canvasH;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff'; ctx.font='bold '+CONFIG.text.fontSize+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, cv.width/2, cv.height/2);
    const data=ctx.getImageData(0,0,cv.width,cv.height).data;
    const points=[];
    for(let y=0;y<cv.height;y+=CONFIG.text.sampleStep){
        for(let x=0;x<cv.width;x+=CONFIG.text.sampleStep){
            const idx=(y*cv.width+x)*4;
            if(data[idx]>128){ points.push({x,y}); }
        }
    }
    // 采样到目标数量
    const result=new Float32Array(targetCount*3);
    for(let i=0;i<targetCount;i++){
        if(points.length===0){ result[i*3]=0; result[i*3+1]=0; result[i*3+2]=0; continue; }
        const p=points[Math.floor(Math.random()*points.length)];
        result[i*3]=(p.x-cv.width/2)*0.15;
        result[i*3+1]=-(p.y-cv.height/2)*0.15;
        result[i*3+2]=(Math.random()-0.5)*8;
    }
    return result;
}

function buildTextSystem(){
    const N=CONFIG.text.particleCount;
    const pos=new Float32Array(N*3);
    const col=new Float32Array(N*3);
    const scl=new Float32Array(N);
    for(let i=0;i<N;i++){
        pos[i*3]=(Math.random()-0.5)*200;
        pos[i*3+1]=(Math.random()-0.5)*200;
        pos[i*3+2]=(Math.random()-0.5)*200;
        scl[i]=0.5+Math.random()*1.0;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aScale', new THREE.BufferAttribute(scl,1));
    textMat=new THREE.ShaderMaterial({
        transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
        uniforms:{
            uPixelRatio:{value:renderer.getPixelRatio()}, uSize:{value:10.0},
            uOpacity:{value:0}, uColor:{value:new THREE.Vector3(1,0.8,0.3)},
        },
        vertexShader:`
            uniform float uSize, uPixelRatio; attribute float aScale;
            void main(){
                vec4 mv=modelViewMatrix*vec4(position,1.0);
                gl_Position=projectionMatrix*mv;
                gl_PointSize=uSize*aScale*uPixelRatio*(300.0/max(0.001,-mv.z));
            }`,
        fragmentShader:`
            uniform float uOpacity; uniform vec3 uColor;
            void main(){
                vec2 uv=gl_PointCoord-0.5; float r=length(uv);
                if(r>0.5) discard;
                float f=exp(-5.0*r*r*4.0);
                gl_FragColor=vec4(uColor, f*uOpacity);
            }`,
    });
    textParticles=new THREE.Points(geo,textMat);
    textParticles.visible=false;
    scene.add(textParticles);
}

function showText(text, color){
    const N=CONFIG.text.particleCount;
    const targets=generateTextPositions(text, N);
    // 随机起点
    const pos=textParticles.geometry.attributes.position.array;
    for(let i=0;i<N;i++){
        // 保留当前位置作为起点,设置目标
    }
    // 存储目标位置
    textParticles.userData.targets=targets;
    textParticles.userData.morphStart=time;
    textParticles.userData.text=text;
    const c=textColors[text]||[1,0.8,0.3];
    textMat.uniforms.uColor.value.set(c[0],c[1],c[2]);
    textMat.uniforms.uOpacity.value=0;
    textParticles.visible=true;
    currentText=text;
    // 文字显示时降低 bloom 让文字清晰
    bloomStrengthTarget=0.6;
}

let bloomStrengthTarget=1.6;
let bloomPassRef=null;

function updateText(dt){
    if(!textParticles || !textParticles.visible) return;
    const pos=textParticles.geometry.attributes.position.array;
    const targets=textParticles.userData.targets;
    if(!targets) return;
    const morphT=Math.min(1,(time-textParticles.userData.morphStart)*0.8);
    for(let i=0;i<CONFIG.text.particleCount;i++){
        pos[i*3]+=(targets[i*3]-pos[i*3])*CONFIG.smoothing;
        pos[i*3+1]+=(targets[i*3+1]-pos[i*3+1])*CONFIG.smoothing;
        pos[i*3+2]+=(targets[i*3+2]-pos[i*3+2])*CONFIG.smoothing;
    }
    textParticles.geometry.attributes.position.needsUpdate=true;
    textMat.uniforms.uOpacity.value=Math.min(0.8, textMat.uniforms.uOpacity.value+dt*1.5);
}

function hideText(){
    if(!textParticles || !textParticles.visible) return;
    textParticles.visible=false;
    currentText='';
    bloomStrengthTarget=1.6;
}

function onResize(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    composer.setSize(innerWidth,innerHeight);
}

/* ============================================================
   3. 相机更新(三轴连续控制 + 无手呼吸待机,借鉴站点2)
   ============================================================ */
function updateCamera(dt){
    // 旋转:平滑跟随(借鉴站点2 *0.05 缓动)
    cam.handRotation += (cam.targetHandRotation - cam.handRotation) * CONFIG.smoothing;
    if(Math.abs(cam.handRotation)>0.05){
        cam.phi += cam.handRotation * CONFIG.camera.rotationSpeed;
    }
    // 缩放
    if(cam.isFist){
        cam.zoomVel += CONFIG.camera.zoomAccel;
        cam.zoomVel = Math.min(cam.zoomVel, CONFIG.camera.zoomVelMax);
    } else if(cam.isOpen){
        const diff = cam.radius - CONFIG.camera.minDistance;
        cam.zoomVel = -diff * 0.05;
    } else {
        cam.zoomVel *= CONFIG.camera.damping;
    }
    cam.radius += cam.zoomVel;
    if(cam.radius<CONFIG.camera.minDistance){ cam.radius=CONFIG.camera.minDistance; cam.zoomVel=0; }
    if(cam.radius>CONFIG.camera.maxDistance){ cam.radius=CONFIG.camera.maxDistance; cam.zoomVel=0; }

    // 平滑插值(统一缓动范式)
    cam.ringExpand += (cam.targetRingExpand - cam.ringExpand) * CONFIG.smoothing;
    cam.corePulse *= 0.94;
    cam.morphHeart += (cam.targetMorphHeart - cam.morphHeart) * 0.04;

    // 无手呼吸待机(借鉴站点2:handLostFrames > idleFrames 后 sin 摆动)
    if(!cam.isHandActive){
        cam.handLostFrames++;
        if(cam.handLostFrames > CONFIG.idleFrames){
            cam.phi -= 0.0008 + Math.sin(time*0.3)*0.0004;
        }
    } else {
        cam.handLostFrames = 0;
    }

    camera.position.x = cam.radius * Math.sin(cam.theta) * Math.sin(cam.phi);
    camera.position.y = cam.radius * Math.cos(cam.theta) + Math.sin(time*0.5)*2; // 轻微浮动
    camera.position.z = cam.radius * Math.sin(cam.theta) * Math.cos(cam.phi);
    camera.lookAt(0,0,0);

    // bloom 强度平滑
    if(bloomPassRef){
        bloomPassRef.strength += (bloomStrengthTarget - bloomPassRef.strength) * 0.05;
    }
}

/* ============================================================
   4. MediaPipe 双手手势识别(双重阈值 + 有效性过滤,借鉴站点1)
   ============================================================ */
const previewCanvas=document.getElementById('webcam-preview');
const previewCtx=previewCanvas.getContext('2d');
previewCanvas.width=320; previewCanvas.height=240;

let lastGesture='';
let fiveCooldown=0, heartCooldown=0;

function distSq(a,b){ return (a.x-b.x)**2 + (a.y-b.y)**2; }

// 手部有效性过滤(防脸误识别)
function isHandValid(lm){
    const handSize=distSq(lm[0], lm[12]);
    if(handSize<0.005 || handSize>0.8) return false;
    const fingerSpread=distSq(lm[4], lm[20]);
    if(fingerSpread<0.01 || fingerSpread>0.5) return false;
    return true;
}

function classifyHand(lm){
    if(!isHandValid(lm)) return null;
    const wrist=lm[0];
    const tips=[8,12,16,20], mcps=[5,9,13,17], pips=[6,10,14,18];
    let extended=0, folded=0;
    // 双重阈值(借鉴站点1)
    for(let i=0;i<4;i++){
        const dTip=distSq(lm[tips[i]],wrist), dMcp=distSq(lm[mcps[i]],wrist);
        const dTipPip=distSq(lm[tips[i]],lm[pips[i]]), dMcpPip=distSq(lm[mcps[i]],lm[pips[i]]);
        if(dTip > dMcp*1.5 && dTipPip > dMcpPip*0.6) extended++;
        else if(dTip < dMcp*1.2) folded++;
    }
    // 拇指
    const thumbExt = distSq(lm[4],lm[0]) > distSq(lm[2],lm[0])*1.3;
    if(thumbExt) extended++;

    const middle=lm[9];
    const dx = middle.x - wrist.x;
    // palmSize(借鉴站点2:手离镜头远近代理)
    const palmSize = Math.sqrt(distSq(wrist, middle));
    return {
        isFist: folded>=3,
        isOpen: extended>=5,
        extended,
        rotation: dx * -5.0,
        center: { x:(wrist.x+lm[12].x)/2, y:(wrist.y+lm[12].y)/2 },
        palmSize,
        thumbUp: thumbExt && folded>=3 && (lm[4].y < wrist.y - 0.1),
    };
}

// 爱心手势检测(借鉴站点1)
function checkHeartGesture(h0, h1){
    const lm0=h0.lm, lm1=h1.lm;
    const thumbDist=distSq(lm0[4], lm1[4]);
    const indexDist=distSq(lm0[8], lm1[8]);
    if(thumbDist<0.02 && indexDist<0.02){
        // 中/无名/小指伸出
        const mid0=distSq(lm0[12],lm0[0]) > distSq(lm0[9],lm0[0])*1.3;
        const mid1=distSq(lm1[12],lm1[0]) > distSq(lm1[9],lm1[0])*1.3;
        if(mid0 && mid1) return true;
    }
    return false;
}

function setGesture(name){
    if(name===lastGesture) return;
    lastGesture=name;
    switch(name){
        case 'fist': audio.fist(); break;
        case 'open': audio.open(); break;
        case 'five':
            if(fiveCooldown<=0){
                // 多朵烟花
                const colors=[
                    [new THREE.Color(1,0.5,0.3),new THREE.Color(1,0.9,0.4)],
                    [new THREE.Color(0.5,0.8,1),new THREE.Color(1,1,1)],
                    [new THREE.Color(1,0.4,0.8),new THREE.Color(1,0.8,0.9)],
                    [new THREE.Color(0.6,1,0.5),new THREE.Color(1,1,0.6)],
                ];
                for(let i=0;i<5;i++){
                    const cl=colors[i%colors.length];
                    setTimeout(()=>{
                        createExplosion(
                            (Math.random()-0.5)*100, (Math.random()-0.5)*60, (Math.random()-0.5)*60,
                            CONFIG.firework.burstCount, cl
                        );
                    }, i*180);
                }
                audio.five();
                fiveCooldown=1.5;
            }
            break;
        case 'heart':
            if(heartCooldown<=0){
                cam.targetMorphHeart=1.0;
                // 烟花
                const colors=[[new THREE.Color(1,0.4,0.6),new THREE.Color(1,0.7,0.9)]];
                for(let i=0;i<6;i++){
                    setTimeout(()=>createExplosion(
                        (Math.random()-0.5)*80,(Math.random()-0.5)*40,(Math.random()-0.5)*40,
                        CONFIG.firework.burstCountBig, colors[0]
                    ), i*150);
                }
                showText('平安吉祥', textColors['平安吉祥']);
                audio.heart();
                heartCooldown=3.0;
            }
            break;
        case 'bothOpen': audio.bothOpen(); break;
        case 'bothFist': audio.bothFist(); cam.corePulse=1.0; break;
        case 'pinch': audio.pinch(); break;
    }
    matRows.forEach(r=> r.classList.toggle('active', r.dataset.g===name));
}

function onResults(results){
    previewCtx.save();
    previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
    previewCtx.drawImage(results.image,0,0,previewCanvas.width,previewCanvas.height);

    if(results.multiHandLandmarks && results.multiHandLandmarks.length>0){
        results.multiHandLandmarks.forEach(lm=>{
            drawConnectors(previewCtx, lm, HAND_CONNECTIONS, {color:'#00FF88', lineWidth:2});
            drawLandmarks(previewCtx, lm, {color:'#FF4488', lineWidth:1, radius:2});
        });
        const rawHands=results.multiHandLandmarks;
        const hands=rawHands.map(lm=>{ const h=classifyHand(lm); if(h) h.lm=lm; return h; }).filter(h=>h);

        if(hands.length>=1){
            cam.isHandActive=true; cam.handLostFrames=0;
        }

        if(hands.length===1){
            const h=hands[0];
            cam.targetHandRotation=h.rotation;
            cam.isFist=h.isFist; cam.isOpen=h.isOpen;
            cam.bothOpen=false; cam.bothFist=false; cam.pinch=false; cam.heart=false;
            cam.targetRingExpand=1.0; cam.targetMorphHeart=0;
            hideText();

            // 5指 → 烟花
            if(h.extended>=5){ setGesture('five'); }
            else if(h.isFist) setGesture('fist');
            else if(h.isOpen) setGesture('open');
            else setGesture('singleRotate');
            updateStatusText();
        } else if(hands.length===2){
            const h0=hands[0], h1=hands[1];
            const dxh=h0.center.x-h1.center.x, dyh=h0.center.y-h1.center.y;
            cam.handDist=Math.sqrt(dxh*dxh+dyh*dyh);
            cam.targetHandRotation=(h0.rotation+h1.rotation)/2;
            cam.isFist=false; cam.isOpen=false;

            if(checkHeartGesture(h0,h1)){
                cam.heart=true; cam.targetMorphHeart=1.0;
                setGesture('heart');
            } else if(h0.isFist && h1.isFist){
                cam.bothFist=true; cam.bothOpen=false; cam.pinch=false; cam.heart=false;
                cam.targetRingExpand=0.6; cam.targetMorphHeart=0;
                hideText();
                setGesture('bothFist');
            } else if(h0.isOpen && h1.isOpen){
                cam.bothOpen=true; cam.bothFist=false; cam.pinch=false; cam.heart=false;
                cam.targetRingExpand=1.0+cam.handDist*2.5;
                cam.targetMorphHeart=0;
                hideText();
                setGesture('bothOpen');
            } else if(cam.handDist<0.18){
                cam.pinch=true; cam.bothOpen=false; cam.bothFist=false; cam.heart=false;
                cam.targetRingExpand=0.85; cam.targetMorphHeart=0;
                hideText();
                setGesture('pinch');
            } else {
                cam.bothOpen=false; cam.bothFist=false; cam.pinch=false; cam.heart=false;
                cam.targetRingExpand=1.0; cam.targetMorphHeart=0;
                hideText();
                setGesture('singleRotate');
            }
            updateStatusText();
        }
    } else {
        cam.isHandActive=false;
        cam.targetHandRotation=0; cam.isFist=false; cam.isOpen=false;
        cam.bothOpen=false; cam.bothFist=false; cam.pinch=false; cam.heart=false;
        cam.targetRingExpand=1.0; cam.targetMorphHeart=0;
        // 文字保留显示直到手势变化
        if(cam.handLostFrames > 60) hideText();
        setGesture('');
        statusEl.innerText='未检测到手';
        statusEl.style.color='#888';
    }
    previewCtx.restore();
}

function updateStatusText(){
    let txt='', col='#00ffcc';
    if(cam.heart){ txt='状态: ❤️ 双手爱心'; col='#ff66aa'; }
    else if(cam.bothFist){ txt='状态: 🤜🤛 双手聚爆'; col='#ff4488'; }
    else if(cam.bothOpen){ txt='状态: 🙌 双手展开'; col='#44ff88'; }
    else if(cam.pinch){ txt='状态: 🤏 双手聚焦'; col='#ffdd44'; }
    else if(cam.isFist){ txt='状态: ✊ 握拳拉远'; col='#ff4444'; }
    else if(cam.isOpen){ txt='状态: ✋ 张开靠近'; col='#44ff44'; }
    else if(lastGesture==='five'){ txt='状态: 🖐️ 五指烟花'; col='#ffaa44'; }
    else { txt='状态: 👋 旋转控制中'; col='#00ffcc'; }
    statusEl.innerText=txt; statusEl.style.color=col;
    matRows.forEach(r=>{
        const v=r.querySelector('.v');
        v.textContent = r.dataset.g===lastGesture ? 'ACTIVE' : '--';
    });
}

function initMediaPipe(){
    try{
        const videoEl=document.getElementById('input-video');
        if(!window.Hands || !window.Camera) throw new Error('MediaPipe 未加载');
        const hands=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
        hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
        hands.onResults(onResults);
        const camUtil=new window.Camera(videoEl, {
            onFrame: async()=>{ await hands.send({image:videoEl}); },
            width:640, height:480
        });
        camUtil.start().then(()=> loadingEl.style.display='none')
            .catch(err=> loadingEl.innerHTML='摄像头启动失败: '+err);
    }catch(err){
        loadingEl.innerHTML='手势模块加载失败('+err.message+')<br><span style="font-size:13px;opacity:0.7">3D 场景仍可观看</span>';
    }
}

/* ============================================================
   5. 动画循环
   ============================================================ */
function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(), 0.05);
    time += dt;

    updateCamera(dt);
    updateMeteors(dt);
    updateFireworks(dt);
    updateText(dt);

    // 冷却
    if(fiveCooldown>0) fiveCooldown-=dt;
    if(heartCooldown>0) heartCooldown-=dt;

    // shader uniforms
    planetMat.uniforms.uTime.value=time;
    planetMat.uniforms.uPulse.value=cam.corePulse;
    planetMat.uniforms.uMorph.value=cam.morphHeart;
    // 全局心跳呼吸:整颗星球明暗如脉搏
    planetMat.uniforms.uGlow.value = 1.0 + Math.sin(time*0.9)*0.07 + cam.corePulse*0.5;
    planet.rotation.y = time*0.08;

    if(emberSystem){
        emberSystem.material.uniforms.uTime.value = time;
        emberSystem.material.uniforms.uMorph.value = cam.morphHeart;
    }
    if(coreGlow){
        coreGlow.material.opacity = Math.min(1.0, 0.78 + Math.sin(time*0.9)*0.1 + cam.corePulse*0.6);
    }
    if(halo){
        halo.scale.setScalar(CONFIG.planet.halo.scale * (1 + Math.sin(time*0.9)*0.03 + cam.corePulse*0.2));
    }

    ringMats.forEach((m,i)=>{
        m.uniforms.uExpand.value=cam.ringExpand;
        m.uniforms.uBrightness.value=1.0+cam.corePulse*1.5;
        ringMeshes[i].rotation.z += ringMeshes[i].userData.spin;
        ringMeshes[i].rotation.y = time*0.02;
    });

    starLayers.forEach(({pts,mat,cfg})=>{
        mat.uniforms.uTime.value=time;
        pts.rotation.y += cfg.spin;
    });

    if(nebula){
        nebula.rotation.y = time*0.005;
        nebula.rotation.x = Math.sin(time*0.02)*0.1;
    }

    if(meteorSystem) meteorSystem.material.uniforms.uTime.value=time;

    composer.render();
}

/* ============================================================
   启动
   ============================================================ */
try{
    initThree();
    // 获取 bloom 引用用于动态强度调整
    composer.passes.forEach(p=>{ if(p instanceof UnrealBloomPass) bloomPassRef=p; });
    animate();
}catch(err){
    loadingEl.innerHTML='当前环境不支持 WebGL<br><span style="font-size:13px;opacity:0.7">请用 Chrome/Edge 打开,或访问 http://127.0.0.1:7777/index.html</span><br><span style="font-size:11px;opacity:0.5">'+(err.message||err)+'</span>';
}
setTimeout(initMediaPipe, 800);
</script>
